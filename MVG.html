<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mariana Vela González, edición salpicón</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --f0:#ffffff; --w0:#f0ece7; --i0:#1f1b18;
    --f1:#fa5b0f; --w1:#e24a05; --i1:#ffffff;
    --f2:#15110f; --w2:#fa5b0f; --i2:#ffffff;
    --f3:#fff1de; --w3:#ffd9b6; --i3:#1f1b18;
    --f4:#0f4c47; --w4:#1b6f68; --i4:#ffffff;
    --f5:#fff8ee; --w5:#ffe2cf; --i5:#1f1b18;
    --accent-brand:#fa5b0f; --accent:#fa5b0f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --f0:#17110e; --w0:#241b16; --i0:#fff4ea;
      --f3:#2a1d15; --w3:#3b2a1f; --i3:#fff4ea;
      --f5:#17110e; --w5:#2a1d16; --i5:#fff4ea;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --f0:#17110e; --w0:#241b16; --i0:#fff4ea;
    --f3:#2a1d15; --w3:#3b2a1f; --i3:#fff4ea;
    --f5:#17110e; --w5:#2a1d16; --i5:#fff4ea;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { height: 100%; margin: 0; background: var(--f0); overflow: hidden;
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

  #app { position: fixed; inset: 0; overflow: hidden; }
  #field, #wipe { position: absolute; inset: 0; }
  #field { background: var(--f0); }
  #wipe { clip-path: inset(0 0 0 100%); }

  #bgword {
    position: absolute; left: 0; right: 0; top: 44%;
    transform: translateY(-50%);
    text-align: center; white-space: nowrap;
    font-weight: 800; line-height: .82; letter-spacing: -0.03em;
    color: var(--w0); pointer-events: none; user-select: none;
  }
  #bgwordIn { display: inline-block; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: grab; outline: none; }
  #gl:active { cursor: grabbing; }
  #gl:focus-visible { outline: 3px solid var(--accent); outline-offset: -6px; }

  #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none; opacity: 0;
    background: linear-gradient(to top, var(--scrimc, transparent) 0%, var(--scrimc, transparent) 58%, transparent 100%); }
  #ui { position: absolute; inset: 0; pointer-events: none; color: var(--i0); }
  #ui > * { pointer-events: auto; }

  .top {
    position: absolute; left: 20px; right: 20px;
    top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; font-weight: 600; pointer-events: none;
  }
  .top .brand { color: var(--accent); }
  .top .where { opacity: .7; }

  .caption {
    position: absolute; left: 20px; right: 20px;
    bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    max-width: 560px; pointer-events: none;
  }
  .caption h1 { margin: 0 0 6px; font-weight: 800; line-height: 1.04;
    font-size: clamp(21px, 5.4vw, 34px); letter-spacing: -0.01em; }
  .caption p { margin: 0; font-weight: 500; line-height: 1.42; opacity: .9;
    font-size: clamp(12.5px, 3.3vw, 16px); }

  .nav {
    position: absolute; left: 0; right: 0;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  .btn {
    width: 46px; height: 46px; border-radius: 50%;
    border: 2px solid var(--accent); background: transparent; color: var(--accent);
    font: 700 22px/1 'Poppins', system-ui, sans-serif; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0 0 3px;
    transition: background .2s, color .2s, opacity .2s;
  }
  .btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .btn:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn.fs { display: none; font-size: 20px; margin-left: 10px; padding: 0; }
  .dots { display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: currentColor; opacity: .25; transition: opacity .3s, transform .3s; }
  .dot[aria-current="true"] { opacity: 1; transform: scale(1.35); background: var(--accent); }
  .dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .hint { position: absolute; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 500;
    opacity: .65; top: calc(40px + env(safe-area-inset-top, 0px)); pointer-events: none; display: none; }

  #loader { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--f0); color: var(--i0); font-weight: 600; font-size: 14px; z-index: 5;
    transition: opacity .5s; }
  #fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 32px; color: var(--i0); background: var(--f0); z-index: 6; font-weight: 600; }

  @media (min-aspect-ratio: 11/10) {
    #scrim { display: none; }
    .btn.fs { display: flex; }
    .caption { left: 56px; bottom: 72px; max-width: min(400px, 32vw); }
    .caption { max-width: min(480px, 32vw); }
    .caption h1 { font-size: clamp(26px, 3.1vw, 62px); }
    .caption p { font-size: clamp(14px, 1.25vw, 24px); }
    .top { font-size: clamp(12px, 1vw, 17px); }
    .nav { justify-content: flex-end; padding-right: 56px; bottom: 28px; }
    .top { left: 56px; right: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot, .btn { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="field"></div>
  <div id="wipe"></div>
  <div id="bgword" aria-hidden="true"><span id="bgwordIn">mariana</span></div>
  <canvas id="gl" tabindex="0" aria-label="Botella 3D de presentación. Arrastra para girarla, o usa las flechas del teclado para cambiar de capítulo."></canvas>

  <div id="scrim"></div>

  <div id="ui">
    <div class="top"><span class="brand">First Talent 2027-1, Coca-Cola FEMSA</span><span class="where" id="where"></span></div>
    <div class="caption" id="caption" aria-live="polite"><h1 id="capTitle"></h1><p id="capSub"></p></div>
    <div class="hint" id="hint"></div>
    <div class="nav">
      <button class="btn" id="prev" type="button" aria-label="Capítulo anterior">&#8249;</button>
      <div class="dots" id="dots"></div>
      <button class="btn" id="next" type="button" aria-label="Capítulo siguiente">&#8250;</button>
      <button class="btn fs" id="fs" type="button" aria-label="Pantalla completa (tecla F)" title="Pantalla completa (F)">&#x26F6;</button>
    </div>
  </div>

  <div id="loader">Preparando la botella</div>
  <div id="fallback">Tu navegador no puede mostrar el modelo 3D. Abre esta página en Chrome, Safari o Edge actualizados.</div>
</div>

function buildEnv() {

  envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true })));
  function box(w, h, x, y, z, v) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(v, v, v), side: THREE.DoubleSide }));

  fitWord();
}
function reservePx() { return portraitLayout ? Math.min(210, H * 0.26) : 0; }
function viewFor(i) {
  var v = CH[i].view, free = (H - reservePx()) / H;
  if (v.kind === 'full') return { vis: (BOTTLE_H * 1.06) / (portraitLayout ? 0.92 : 0.84) / free * (portraitLayout ? 1.0 : 1.0), ty: 0, need: 0.9 };
  return { vis: (LABEL_H / (v.fill * (portraitLayout ? 1 : 0.76))) / free, ty: LABEL_MID + v.ty, need: R_LABEL * 1.9 };
}
function applyCamera() {
  var vis = state.vis, aspect = W / H;
  if (vis * aspect < state.need) vis = state.need / aspect;
  var fov = camera.fov * Math.PI / 180, d = vis / (2 * Math.tan(fov / 2));
  camera.position.set(0, state.ty, d); camera.lookAt(0, state.ty, 0);
  var r = reservePx();
  if (r > 0) camera.setViewOffset(W, H, 0, r / 2, W, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}

/* ---------- Palabra gigante ---------- */
var wordCanvas = document.createElement('canvas').getContext('2d');
function fitWord() {
  wordCanvas.font = '800 100px Poppins, system-ui, sans-serif';
  var w100 = wordCanvas.measureText(elWord.textContent).width;
  var size = Math.min(window.innerWidth * 0.98 / w100 * 100, window.innerHeight * 0.55);
  elWord.style.fontSize = size + 'px';
  elWord.style.top = (portraitLayout ? 36 : 46) + '%';
}
function setWord(t) { elWord.textContent = t; fitWord(); }

/* ---------- Capítulos: transiciones narrativas con GSAP ---------- */
var cur = -1, busy = false, pending = null, hintGone = false;
var elWordIn = document.getElementById('bgwordIn'), elScrim = document.getElementById('scrim'), elTop = document.querySelector('.top');
function setWordText(t) { elWordIn.textContent = t; fitWord(); }
function D(x) { return x * DUR; }
function setAccent(c) { elUI.style.setProperty('--accent', c.acc === 'i' ? cssVar(c.ink) : cssVar('--accent-brand')); }
function setCaption(c) { elTitle.textContent = c.title; elSub.textContent = c.sub; elWhere.textContent = c.where; }
function updateNav(i) {
  for (var j = 0; j < dotEls.length; j++) dotEls[j].setAttribute('aria-current', j === i ? 'true' : 'false');
  elPrev.disabled = i === 0; elNext.disabled = i === N - 1;
}

function applyInstant(i) {
  var c = CH[i], v = viewFor(i);
  elField.style.backgroundColor = cssVar(c.field);
  elWord.style.color = cssVar(c.wcol); elUI.style.color = cssVar(c.ink);
  setWordText(c.word); setCaption(c); setAccent(c);
  state.vis = v.vis; state.ty = v.ty; state.need = v.need; state.rotY = c.rot; state.pRot = 0; state.bScaleX = 1;
  state.pOn = c.person ? 1 : 0; state.bottleOn = c.person ? 0 : 1;
  state.seal0 = state.seal1 = c.seals ? 1 : 0;
  elScrim.style.setProperty('--scrimc', cssVar(c.field)); elScrim.style.opacity = c.view.kind === 'label' ? 1 : 0; elTop.style.opacity = c.view.kind === 'label' ? 0 : 1;
  updateNav(i);
}

function goTo(i) {
  if (i < 0 || i >= N) return;
  if (busy) { pending = i; return; }
  if (i === cur) return;
  var from = cur, c = CH[i], v = viewFor(i);
  busy = true; pending = null;
  var tl = gsap.timeline({ onComplete: function () {
    busy = false; cur = i;
    if (pending !== null && pending !== cur) { var p = pending; pending = null; goTo(p); } else pending = null;
  } });
  var fieldCol = cssVar(c.field);

  // Color de fondo: cortina que entra desde la derecha
  elWipe.style.backgroundColor = fieldCol;
  tl.fromTo(elWipe, { clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0%)', duration: D(0.8), ease: 'power3.inOut' }, 0.05 * DUR);
  tl.add(function () { elField.style.backgroundColor = fieldCol; gsap.set(elWipe, { clipPath: 'inset(0 0 0 100%)' }); elScrim.style.setProperty('--scrimc', fieldCol); }, D(0.88));
  tl.to(elScrim, { opacity: c.view.kind === 'label' ? 1 : 0, duration: D(0.6), ease: 'power2.inOut' }, D(0.5));
  tl.to(elTop, { opacity: c.view.kind === 'label' ? 0 : 1, duration: D(0.4), ease: 'power2.inOut' }, D(0.3));

  // Palabra gigante: sale, cambia, entra
  tl.to(elWordIn, { yPercent: -35, opacity: 0, duration: D(0.35), ease: 'power2.in' }, 0);
  tl.add(function () { setWordText(c.word); elWord.style.color = cssVar(c.wcol); }, D(0.4));
  tl.fromTo(elWordIn, { yPercent: 35, opacity: 0 }, { yPercent: 0, opacity: 1, duration: D(0.75), ease: 'power3.out' }, D(0.42));
  tl.to(elUI, { color: cssVar(c.ink), duration: D(0.6), ease: 'none' }, D(0.2));

  // Pie de capítulo
  tl.to(elCap, { opacity: 0, y: 12, duration: D(0.25), ease: 'power1.in' }, 0);
  tl.add(function () { setCaption(c); setAccent(c); updateNav(i); }, D(0.3));
  tl.to(elCap, { opacity: 1, y: 0, duration: D(0.6), ease: 'power3.out' }, D(0.62));

  // Objeto 3D
  var camT = D(1.25);
  if (from === 0 && i >= 1) {
    tl.to(state, { pRot: Math.PI / 2, duration: D(0.5), ease: 'power2.in' }, 0.05 * DUR);
    tl.set(state, { pOn: 0, bottleOn: 1, rotY: -Math.PI / 2, bScaleX: 0.04, pRot: 0 }, D(0.56));
    tl.to(state, { rotY: c.rot, duration: D(1.05), ease: 'power3.out' }, D(0.56));
    tl.to(state, { bScaleX: 1, duration: D(0.8), ease: 'power3.out' }, D(0.56));
  } else if (i === 0 && from >= 1) {
    tl.to(state, { bScaleX: 0.04, rotY: state.rotY + Math.PI / 2, duration: D(0.5), ease: 'power2.in' }, 0.05 * DUR);
    tl.set(state, { pOn: 1, bottleOn: 0, pRot: -Math.PI / 2, rotY: 0, bScaleX: 1 }, D(0.56));
    tl.to(state, { pRot: 0, duration: D(1.0), ease: 'power3.out' }, D(0.56));
  } else {
    tl.to(state, { rotY: c.rot, duration: D(i === N - 1 ? 1.9 : 1.35), ease: 'power3.inOut' }, 0.1 * DUR);
  }
  tl.to(state, { vis: v.vis, ty: v.ty, need: v.need, duration: camT, ease: 'power3.inOut' }, 0.1 * DUR);

  // Sellos: se estampan al llegar al capítulo 3
  var sealIn = CH[i].seals, sealWas = from >= 0 ? CH[from].seals : 0;
  if (sealIn && !sealWas) {
    var base = (i === 2 && from === 1) ? 1.25 : 0.7;
    tl.to(state, { seal0: 1, duration: D(0.55), ease: 'expo.out' }, D(base));
    tl.to(state, { seal1: 1, duration: D(0.55), ease: 'expo.out' }, D(base + 0.3));
  } else if (!sealIn && sealWas) {
    tl.to(state, { seal0: 0, seal1: 0, duration: D(0.4), ease: 'power2.in' }, 0);
  }
  if (window.__mv) window.__mv.tl = tl;
  cur = from; // se confirma al completar
  if (!hintGone && i >= 1) { hintGone = true; gsap.to(elHint, { opacity: 0, duration: 0.4 }); }
}

function next() { goTo(Math.min(N - 1, (busy && pending !== null ? pending : cur) + 1)); }
function prev() { goTo(Math.max(0, (busy && pending !== null ? pending : cur) - 1)); }

/* ---------- Interacción ---------- */
var pointer = { down: false, x: 0, y: 0, sx: 0, sy: 0, moved: 0 };
elGL.addEventListener('pointerdown', function (e) {
  pointer.down = true; pointer.x = pointer.sx = e.clientX; pointer.y = pointer.sy = e.clientY; pointer.moved = 0;
  try { elGL.setPointerCapture(e.pointerId); } catch (err) {}
  gsap.killTweensOf(drag);
});
elGL.addEventListener('pointermove', function (e) {
  if (!pointer.down) return;
  var dx = e.clientX - pointer.x; pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved += Math.abs(dx);
  if (state.pOn > 0.5) drag.py = Math.max(-0.7, Math.min(0.7, drag.py + dx * 0.008));
  else drag.y += dx * 0.012;
});
function release(e) {
  if (!pointer.down) return; pointer.down = false;
  var dy = pointer.y - pointer.sy, dx = pointer.x - pointer.sx;
  if (Math.abs(dy) > 90 && Math.abs(dx) < 50) { dy < 0 ? next() : prev(); }
  var spring = cur === N - 1 ? 0 : 0;
  gsap.to(drag, { y: 0, py: 0, duration: reduce ? 0.01 : 1.4, ease: 'elastic.out(1,0.55)' });
}
elGL.addEventListener('pointerup', release);
elGL.addEventListener('pointercancel', release);

var wheelLock = false;
window.addEventListener('wheel', function (e) {
  if (Math.abs(e.deltaY) < 18 || wheelLock) return;
  wheelLock = true; setTimeout(function () { wheelLock = false; }, 950);
  e.deltaY > 0 ? next() : prev();
}, { passive: true });
window.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') { next(); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { prev(); e.preventDefault(); }
  else if (k === 'Home') goTo(0); else if (k === 'End') goTo(N - 1);
});
elNext.addEventListener('click', next); elPrev.addEventListener('click', prev);
function toggleFS() {
  var d = document, el = d.documentElement;
  if (!d.fullscreenElement && !d.webkitFullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
  else { (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d); }
}
var elFs = document.getElementById('fs'); if (elFs) elFs.addEventListener('click', toggleFS);
window.addEventListener('keydown', function (e) { if (e.key === 'f' || e.key === 'F') toggleFS(); });

/* ---------- Bucle de render ---------- */
function frame(t) {
  var time = t / 1000;
  applyCamera();
  bottle.visible = state.bottleOn > 0.5; portrait.visible = state.pOn > 0.5;
  var sway = reduce ? 0 : Math.sin(time * 0.8) * 0.035, bob = reduce ? 0 : Math.sin(time * 1.1) * 0.01;
  bottle.rotation.y = state.rotY + drag.y + sway; bottle.scale.x = state.bScaleX; bottle.position.y = bob;
  portrait.rotation.y = state.pRot + drag.py + (reduce ? 0 : Math.sin(time * 0.7) * 0.05); portrait.position.y = bob;
  var sv = [state.seal0, state.seal1];
  for (var i = 0; i < seals.length; i++) {
    var s = Math.max(0, Math.min(1, sv[i]));
    seals[i].parent.visible = s > 0.001;
    seals[i].scale.setScalar(1 + (1 - s) * 1.3); sealMats[i].opacity = s; seals[i].rotation.z = (1 - s) * 0.45;
  }
  elWord.style.transform = 'translateY(-50%) translateX(' + (-(drag.y + drag.py) * 90) + 'px)';
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- Arranque ---------- */
function start() {
  try { build3D(); } catch (err) { console.error(err); document.getElementById('fallback').style.display = 'flex'; elLoader.style.display = 'none'; return; }
  layout(); applyInstant(0); cur = 0;
  elHint.textContent = (window.innerWidth / window.innerHeight) >= 1.1 ? 'Flechas o barra espaciadora para avanzar, F para pantalla completa' : 'Arrastra para girar la botella'; elHint.style.display = 'block';
  window.addEventListener('resize', function () {
    layout(); if (!busy && cur >= 0) { var v = viewFor(cur); state.vis = v.vis; state.ty = v.ty; state.need = v.need; }
  });
  window.__mv = { goTo: goTo, state: state, drag: drag, CH: CH, get cur() { return cur; }, get busy() { return busy; } };
  requestAnimationFrame(frame);
  setTimeout(function () { elLoader.style.opacity = 0; setTimeout(function () { elLoader.style.display = 'none'; }, 600); }, 250);
}

var fontLoads = ['800 40px Poppins', '700 40px Poppins', '600 40px Poppins', '500 40px Poppins'].map(function (f) { return document.fonts && document.fonts.load ? document.fonts.load(f, 'Aáéíóúñ') : Promise.resolve(); });
Promise.race([Promise.all(fontLoads), new Promise(function (r) { setTimeout(r, 3500); })]).then(start, start);

})();

</script>
